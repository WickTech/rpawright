[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpawright"
version = "0.1.0.dev0"
description = "Open-source, self-healing web RPA: record browser tasks to YAML, run them on a schedule."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["rpa", "automation", "playwright", "yaml", "browser", "web-automation", "testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "playwright>=1.47",
    "jinja2>=3.1.6",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/WickTech/rpawright"
Repository = "https://github.com/WickTech/rpawright"
Issues = "https://github.com/WickTech/rpawright/issues"

[project.scripts]
rpawright = "rpawright.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff", "types-openpyxl"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers", ".superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpawright"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["rpawright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rpawright --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# Playwright's sync API runs user code inside greenlets; without this coverage misses it.
concurrency = ["greenlet", "thread"]
